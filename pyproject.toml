[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Minimal metadata only so `pip install -e .` makes `ctclf` importable.
# Dependencies are pinned in requirements.txt.
[project]
name = "ctclf"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/ctclf"]
